name: Offline vertical-slice checks
on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_vs07_ui_state.cjs
      - run: node tests/test_vs11_column_ui.cjs
  windows-b1-http:
    # Live ETABS COM is not required; this checks Windows socket/HTTP behavior
    # that Ubuntu cannot exercise (cross-origin rejection, WinError 10053).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_vs06_b1_*.py" -v
      - run: python -m unittest discover -s tests -p "test_vs11_*.py" -v
