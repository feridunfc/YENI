name: Offline vertical-slice checks
on:
  push:
    branches: [main, "work/**", "recovery/**", "integration/**", "docs/**"]
  pull_request:
    branches: [main, "work/**", "docs/**"]
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - run: python -m pip wheel --no-deps --wheel-dir "${{ runner.temp }}/yeni-wheel" .
      - name: Replay reports from the installed wheel
        run: python tools/test_installed_wheel.py "${{ runner.temp }}/yeni-wheel"
      - run: python tools/test_offline.py
