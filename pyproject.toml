[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbdy-next-engine"
version = "0.1.0"
description = "Independent, vertical-slice-first Turkish structural engineering engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# ETABS is an in-process Windows COM integration. Keep Linux/offline CI free
# of Windows-only imports while making the live workstation setup reproducible.
etabs-windows = ["comtypes>=1.4,<2; sys_platform == 'win32'"]

[project.scripts]
tbdy-next = "tbdy_next.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tbdy_next" = ["static/*.html", "static/*.js"]
"tbdy_next.verification" = ["data/*.json", "data/*.zip", "references/*.py"]
